# Fonte única de verdade sobre quem está sendo orientado.
# O repositório de cada aluno (código do projeto + documentação) é trazido como submódulo git
# em alunos/<slug>/ (ver scripts/adicionar-orientando.sh). O texto do TCC fica em
# alunos/<slug>/<tcc_dir>/: docs se o repositório tem código do projeto + TCC, ou . (raiz) se o
# repositório é só do TCC (ver contrato/estrutura-repo-aluno.md).
# Este arquivo não armazena o texto do TCC.
#
# Formato de uma entrada:
# - slug: joao-silva
#   aluno: João Silva
#   matricula: "2026123456"             # matrícula do aluno, string (preserva zeros à esquerda)
#   repo: seuusuario/tcc-joao-silva      # owner/repo, formato aceito pelo gh
#   branch: main
#   tcc_dir: docs                        # docs (código + TCC) ou . (só o TCC, na raiz)
#   etapa_atual: 04-referencial-teorico  # nome de arquivo em etapas/, sem .md (00 a 09)
#   status: em andamento
#   ultima_atualizacao: 2026-09-20
#
# A matrícula é obrigatória no cadastro e é dado cadastral do aluno: registrada e corrigida pela
# tcc-10-cadastrar. Nunca invente nem deduza a matrícula — pergunte. Entradas antigas com
# matricula: "" estão pendentes de preenchimento.


# Fonte única de verdade sobre quem está sendo orientado.
# O repositório de cada aluno (código do projeto + documentação) é trazido como submódulo git
# em alunos/<slug>/ (ver scripts/adicionar-orientando.sh). O texto do TCC fica em
# alunos/<slug>/<tcc_dir>/, por padrão docs/TCC (ver contrato/estrutura-repo-aluno.md).
# Este arquivo não armazena o texto do TCC.
#
# Formato de uma entrada:
# - slug: joao-silva
#   aluno: João Silva
#   repo: seuusuario/tcc-joao-silva      # owner/repo, formato aceito pelo gh
#   branch: main
#   tcc_dir: docs/TCC                    # caminho do texto Typst dentro do repo do aluno
#   etapa_atual: 04-referencial-teorico  # nome de arquivo em etapas/, sem .md (00 a 09)
#   status: em andamento
#   ultima_atualizacao: 2026-09-20

